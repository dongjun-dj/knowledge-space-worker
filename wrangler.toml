name = "knowledge-space-worker"
main = "src/worker.js"
compatibility_date = "2026-05-03"

# Production secrets should be configured with:
# npx wrangler secret put INGEST_TOKEN
# npx wrangler secret put ARK_API_KEY
# npx wrangler secret put LLM_BASE_URL
# npx wrangler secret put LLM_MODEL
# npx wrangler secret put TIKHUB_API_KEY
# npx wrangler secret put FIRECRAWL_API_KEY
# npx wrangler secret put NOTION_API_KEY
# npx wrangler secret put NOTION_DATABASE_ID
# npx wrangler secret put BARK_KEY
# npx wrangler secret put VOLC_ACCESS_KEY
# npx wrangler secret put VOLC_SECRET_KEY
# npx wrangler secret put JINA_API_KEY
# 提示：也可以用部署后生成的 /admin 配置页来填（更推荐，直接写入 D1）

[vars]
NOTION_VERSION = "2022-06-28"
DEFAULT_TOP_K = "5"

[[d1_databases]]
binding = "kb_logs"
database_name = "kb-logs"
database_id = "local-dev-placeholder"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "ingest-tasks"

[[queues.consumers]]
queue = "ingest-tasks"
max_batch_size = 1
max_batch_timeout = 1

# [ai] 本地测试时注释掉，避免 wrangler dev 强制连 Cloudflare
# [ai]
# binding = "AI"
