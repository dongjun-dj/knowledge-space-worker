<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>收录结果</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    #message { color: #475467; line-height: 1.6; word-break: break-word; }
    .ok { color: #067647; }
    .err { color: #b42318; }
    button { margin-top: 16px; border: 0; border-radius: 10px; padding: 9px 14px; background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
    .hint { margin-top: 10px; color: #98a2b3; font-size: 12px; }
  </style>
</head>
<body>
  <h1 id="title">收录结果</h1>
  <div id="message"></div>
  <button id="close">关闭</button>
  <div class="hint">此窗口用于兜底提示；如果系统通知被拦截，也能看到结果。</div>
  <script type="module" src="result.js"></script>
</body>
</html>
