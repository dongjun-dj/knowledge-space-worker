<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>知识库插件设置</title>
  <style>
    body { max-width: 720px; margin: 36px auto; padding: 0 20px; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #d0d5dd; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    button { margin-top: 16px; border: 0; border-radius: 10px; padding: 10px 14px; background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
    .hint { color: #667085; line-height: 1.6; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>收录到知识库 - 插件设置</h1>
  <p class="hint">INGEST_TOKEN 只保存在 Chrome 本地同步存储，不写入插件代码。若截图外发，请遮挡 INGEST_TOKEN。</p>
  <label for="workerBaseUrl">Worker URL</label>
  <input id="workerBaseUrl" placeholder="https://你的Worker域名.workers.dev" />
  <label for="ingestToken">INGEST_TOKEN</label>
  <input id="ingestToken" type="password" placeholder="kb_..." />
  <button id="save">保存设置</button>
  <button id="test" type="button">测试连接</button>
  <div id="status" class="hint"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
